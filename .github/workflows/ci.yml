name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    # The physics suite simulates minutes of world time; locally it is ~7-8
    # minutes and a CI runner is slower. Generous, but it should never be hit.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Physics and unit tests
        run: npm run test:run

      - name: Production build
        run: npm run build
